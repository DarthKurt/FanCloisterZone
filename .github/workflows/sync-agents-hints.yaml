name: Sync Agent Hints

on:
  push:
    branches: [main, topic/agentic-flows]
    paths:
      - "docs/agent-hints/**"
      - "scripts/gen-agent-hints.sh"
      - ".github/workflows/sync-agents-hints.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/darthkurt/ci-alpine:0.1.0

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute source hash
        id: hash
        run: |
          h=$(find docs/agent-hints scripts/gen-agent-hints.sh \
            -type f | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "value=$h" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        id: cache
        with:
          path: .agent-hints-hash
          key: agent-hints-${{ steps.hash.outputs.value }}

      - name: Generate
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/gen-agent-hints.sh

      - name: Commit & push
        if: steps.cache.outputs.cache-hit != 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: sync agent hints [skip ci]"
          file_pattern: ".kiro/steering/ .github/instructions/ .github/copilot-instructions.md"

      - name: Save hash
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "${{ steps.hash.outputs.value }}" > .agent-hints-hash
