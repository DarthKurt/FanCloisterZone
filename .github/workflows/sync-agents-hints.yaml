name: Sync Agent Hints

on:
  push:
    branches: [main, topic/agentic-flows]
    paths:
      - "docs/agent-hints/**"
      - "scripts/gen-agent-hints.sh"
      - ".github/workflows/sync-agents-hints.yaml"
      - ".kiro/steering/**"
      - ".github/instructions/**"
      - ".github/copilot-instructions.md"
      - ".agent-hints-hash"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/darthkurt/ci-alpine:0.1.0

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configure git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate
        run: bash scripts/gen-agent-hints.sh

      - name: Commit & push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: sync agent hints [skip ci]"
          file_pattern: ".kiro/steering/ .github/instructions/ .github/copilot-instructions.md .agent-hints-hash"
